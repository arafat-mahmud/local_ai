name: local_ai
description: "Offline local AI app with in-app model downloader and updater."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  path: ^1.9.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  fllama: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:

  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/developer_avatar.png

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#cfcfcf"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#cfcfcf"
    theme_color: "#cfcfcf"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
