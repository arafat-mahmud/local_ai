name: local_ai
description: "Offline local AI app with in-app model downloader and updater."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  fllama: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  
